  - id: liFHsc8h0hc
    url: https://youtu.be/liFHsc8h0hc
    title: "Braydon Bringhurst's 8600FT"
    added: "2026-08-30"
    focus: full-length source (92 min, 1080p, AV1) -- scanned for shots
    status: trained
    notes: >
      Too long to track frame-by-frame; used a two-stage funnel instead
      (src/long_video.py): a fast ffmpeg-based motion scan across all 92
      minutes picked 12 candidate peaks spaced >=3 min apart, then the
      real tracker verified each short clip. Only one candidate held up
      as a genuine, clean highlight (24:36 -- a technical redrock feature,
      "14th Attempt" overlay, bike conf 0.87, attack score 0.50). One
      candidate (10:52) turned out to be unrelated third-party footage
      (a home-security clip of children) spliced into the source video --
      discarded, not used in any output. One candidate (0:41) was genuine
      slickrock riding but the pose model tracked the rider's shadow
      instead of the rider -- also discarded as a tracking artifact.
  - id: hdspQwUno_Q
    url: https://youtu.be/hdspQwUno_Q
    title: "Friday Fails 2025"
    added: "2026-09-01"
    focus: crash footage -- negatives for the control classifier
    status: trained
    notes: >
      1808s compilation, too long to track frame-by-frame. Funneled via
      src/long_video.py's motion scan into 20 candidate 10s clips, each
      verified with the real tracker (output/friday2/summary.json), then
      screened for crash moments with the pose-drop heuristic and
      confirmed/rejected by reading before/at/after frames -- 7 of 11
      flagged moments were genuine continuous falls, 4 were hard cuts
      between compilation clips (see data/crashes.yaml). Fed
      src/crash_model.py's control_model_v001.joblib (144 windows across
      23 videos, 23 pre-crash negatives, leave-one-video-out AUC 0.719).
