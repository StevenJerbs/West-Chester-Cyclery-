# Training video manifest for the downhill bike kinematic visual model.
# Each session appends the videos it trained on; the pipeline reads this
# file to know which footage is part of the training set.
videos:
  - id: u2gOY98G0B8
    url: https://youtu.be/u2gOY98G0B8
    added: "2026-08-30"
    focus: suspension cycling in rough terrain
    status: pending  # blocked: youtube.com unreachable from remote env
    notes: >
      Selected for shots where front/rear suspension is actively cycling
      through rough terrain. Highlight shots should show the model tracking
      both rider pose and bike geometry through compressions and rebounds.
  - id: f1d77c07-ScreenRecording_08302026_004143_1
    source: user upload (screen recording of the above)
    added: "2026-08-30"
    focus: suspension cycling in rough terrain
    status: trained
    notes: >
      10.8s DH race clip, 2622x1206 @ 27fps. Rider pose tracked in 70% of
      frames, bike in 23% (motion blur limits the nano detector). Top
      suspension-cycling shot: 0.58-3.57s, peak activity 1.0.
  - id: eca6c43c-ScreenRecording_08302026_093954_1
    source: user upload (screen recording)
    added: "2026-08-30"
    focus: joint-angle analysis, vision path
    status: trained
    notes: >
      9.4s DH clip, chase POV, decoded with a 90/270-degree orientation
      mismatch (no rotation metadata) -- pipeline now auto-detects and
      corrects this via track.detect_orientation. Pose tracked in 95% of
      frames, bike in 35%. Attack-position score 0.32, look-ahead 30%.
  - id: liFHsc8h0hc
    url: https://youtu.be/liFHsc8h0hc
    title: "Braydon Bringhurst's 8600FT"
    added: "2026-08-30"
    focus: full-length source (92 min, 1080p, AV1) -- scanned for shots
    status: trained
    notes: >
      Too long to track frame-by-frame; used a two-stage funnel instead
      (src/long_video.py): a fast ffmpeg-based motion scan across all 92
      minutes picked 12 candidate peaks spaced >=3 min apart, then the
      real tracker verified each short clip. Only one candidate held up
      as a genuine, clean highlight (24:36 -- a technical redrock feature,
      "14th Attempt" overlay, bike conf 0.87, attack score 0.50). One
      candidate (10:52) turned out to be unrelated third-party footage
      (a home-security clip of children) spliced into the source video --
      discarded, not used in any output. One candidate (0:41) was genuine
      slickrock riding but the pose model tracked the rider's shadow
      instead of the rider -- also discarded as a tracking artifact.
  - id: hdspQwUno_Q
    url: https://youtu.be/hdspQwUno_Q
    title: "Friday Fails 2025"
    added: "2026-09-01"
    focus: crash footage -- negatives for the control classifier
    status: trained
    notes: >
      1808s compilation, too long to track frame-by-frame. Funneled via
      src/long_video.py's motion scan into 20 candidate 10s clips, each
      verified with the real tracker (output/friday2/summary.json), then
      screened for crash moments with the pose-drop heuristic and
      confirmed/rejected by reading before/at/after frames -- 7 of 11
      flagged moments were genuine continuous falls, 4 were hard cuts
      between compilation clips (see data/crashes.yaml). Fed
      src/crash_model.py's control_model_v001.joblib (144 windows across
      23 videos, 23 pre-crash negatives, leave-one-video-out AUC 0.719).
  - id: Y50K3ZZEdVY
    url: https://youtu.be/Y50K3ZZEdVY
    title: "Asa Vermette vs. An Average Rider - How Much Faster is a DH Pro?"
    added: "2026-09-02"
    focus: advanced-vs-intermediate rider comparison (pro vs. average, same lines)
    status: trained
    notes: >
      Asa Vermette (light/white Fox kit, Red Bull helmet, bib #3) vs
      Charlie the average rider (black kit, plain helmet), identified by
      kit color per user-supplied cue and verified frame-by-frame across
      the video's own three "Section N: Asa X.XXs / Charlie X.XXs" stat
      overlays -- exact ground truth: section 1 Asa 10.18s/Charlie
      13.08s (21% faster), section 2 Asa 6.07s/Charlie 9.00s (48%
      faster), section 3 (G-out compression) Asa 10.28s/Charlie 13.19s
      (28% faster). Cut 6 clean single-rider sub-clips (asa_range /
      charlie_range in crash_training/Y50K3ZZEdVY.segments.json) and ran
      the full RiderFormModel pipeline on each (data/raw/asa_vs_charlie/,
      output/asa_vs_charlie/). Form grade, attack-position %, and
      look-ahead % all favor Asa across all three sections; look-ahead
      is the largest and most consistent gap (e.g. section 3: 46.2% vs
      19.6%). Fed data/riders.yaml so form_grade.factor_report()'s
      learned advanced-vs-other comparison is now live (3 runs each
      level). Race-POV section (260-580s) not processed -- low value for
      side-on keypoints per the segment map.
  - id: E_ENTKM2_q4
    url: https://youtu.be/E_ENTKM2_q4
    title: "FPV Drone View GoPro: Jackson Goldstone's Winning Run, Val di Sole 2023"
    added: "2026-09-03"
    focus: wheel/suspension/tyre layer -- axle travel, wheel roll, ground contact, traction
    status: trained
    bike_id: jackson-goldstone-v10
    notes: >
      35s, 1080p25, AV1 (transcoded to H.264 at data/raw/goldstone/vds_2023.mp4).
      Continuous FPV chase, rear/quarter views, strong motion blur. First
      run of src/wheels.py + src/tire_model.py with the V10 specs from the
      owner-supplied Pinkbike bike check giving the mm scale (8.0 mm/px).
      Results: bike tracked 33% of frames (detection retries at 1280 px),
      both wheels found 24%, front/rear labels verified correct in rear
      views on the labeled video; contact 82-88%, airborne 6-9%. Fork and
      shock compression saturate at their cap (p95 220 / 244 mm vs 200 /
      208 travel): at this scale the sprung-unsprung distances jitter by
      a wheel radius, so travel is a bounded proxy here. Slip ratio, slip
      angle and lateral drift all failed the estimator self-check (median
      |kappa| 0.98, alpha 29 deg, "sliding" 91%): reported as unmeasurable,
      and the tyre envelope fit refused. Needs sharper, closer footage.
      With the zoomed detection retry: bike 39%, pose 76%, both wheels 30%.
      Rotation-rate proxies (deg/s, max / p95 / rms): pitch 279 / 115 / 62
      at 4.0s, roll 245 / 124 / 60 at 9.2s, yaw 258 / 181 / 90 at 18.2s.
      Speed estimate: median 23, p95 73, max 78 km/h at 21.7s, 27%
      coverage. See output/goldstone/vds_2023/result.json and
      labeled_goldstone_vds_2023.mp4.
  - id: 3oUbTSelGH8
    url: https://youtu.be/3oUbTSelGH8
    title: "Drone FPV: Jackson Goldstone's Insane Run, 2023 Mont-Sainte-Anne"
    added: "2026-09-03"
    focus: wheel/suspension/tyre layer, second pro reference run
    status: trained
    bike_id: jackson-goldstone-v10
    notes: >
      52s, 1080p24, AV1 (transcoded to data/raw/goldstone/msa_2023.mp4).
      First pass ran upside down: detect_orientation picked 180 deg on a
      marginal pose score (bike 1%, pose 34%). With upright kept as the
      prior and the zoomed detection retry: bike 38%, pose 82%, both
      wheels 31%, contact 90%. Rotation-rate proxies (deg/s, max / p95 /
      rms): pitch 284 / 181 / 76 at 35.0s, roll 268 / 135 / 62 at 21.2s,
      yaw 243 / 168 / 85 at 16.0s. Ground-shift speed estimate: median 20,
      p95 65, max 70 km/h at 30.2s, 22% coverage (fires only where the
      ground beside the bike is textured enough, so the median is biased
      to the slower sections). Form 57.9, attack 56%, look-ahead 64%.
      Labeled video with skeleton, bike, wheels, vision path and rate/speed
      HUD: output/goldstone/msa_2023/labeled_goldstone_msa_2023.mp4.
