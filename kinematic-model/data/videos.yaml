  - id: eca6c43c-ScreenRecording_08302026_093954_1
    source: user upload (screen recording)
    added: "2026-08-30"
    focus: joint-angle analysis, vision path
    status: trained
    notes: >
      9.4s DH clip, chase POV, decoded with a 90/270-degree orientation
